plugins:
  - rubocop-rspec

AllCops:
  Exclude:
    - wor-paginate.gemspec
    - spec/dummy/db/**/*
    - spec/dummy/config/**/*
    - spec/dummy/bin/**/*
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Layout/LineLength:
  Max: 99

Style/FrozenStringLiteralComment:
  Enabled: false

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - spec/**/*

# rubocop-rspec custom configurations

Naming/VariableNumber:
  EnforcedStyle: snake_case

RSpec/ExampleLength:
  Enabled: false

RSpec/AnyInstance:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/NestedGroups:
  Max: 5

Lint/AmbiguousBlockAssociation:
  Enabled: false

RSpec/LetSetup:
  Enabled: false

# matchers_spec.rb describes DummyModelsController to test the be_paginated
# matcher against real responses, not to test the controller itself, so its
# name doesn't follow the described-class convention on purpose.
RSpec/SpecFilePathFormat:
  Exclude:
    - spec/matchers_spec.rb

RSpec/SpecFilePathSuffix:
  Exclude:
    - spec/matchers_spec.rb
